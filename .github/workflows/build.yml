name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK bouwen
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Foutmeldingen samenvatten
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|> " -A3 build.log | head -300 > errors.txt || true
          cat errors.txt
          grep -E "^e: " build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true
          echo '```' >> $GITHUB_STEP_SUMMARY; head -150 errors.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Log op branch ci-logs zetten
        if: always()
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/ && cp errors.txt /tmp/logs/ 2>/dev/null || true
          echo "${{ job.status }} $(git rev-parse --short HEAD)" > /tmp/logs/status.txt
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan ci-logs && git rm -rfq . && cp /tmp/logs/* . && git add -f build.log status.txt errors.txt 2>/dev/null; git add -f build.log status.txt
          git commit -qm "CI-log $(cat status.txt)" && git push -qf origin ci-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Bingr-Android-apk
          path: app/build/outputs/apk/release/*.apk

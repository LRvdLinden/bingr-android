name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      # openbare SHA-256-vingerafdruk van de Bingr-releasesleutel (staat in elke APK)
      BINGR_CERT_SHA256: "9E:D5:B7:30:C7:A4:B4:57:B8:0E:F9:91:A4:C6:FA:46:9C:9B:29:28:5B:9B:39:08:A8:93:6D:57:D0:C5:53:6B"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.10.2'

      - name: Ondertekensleutel klaarzetten
        env:
          KS: ${{ secrets.BINGR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bingr-release.jks"
            echo "BINGR_KEYSTORE=$RUNNER_TEMP/bingr-release.jks" >> "$GITHUB_ENV"
            echo "::notice::APK wordt ondertekend met de vaste Bingr-sleutel"
          else
            echo "::warning::Secret BINGR_KEYSTORE_BASE64 ontbreekt: APK krijgt een tijdelijke sleutel en kan niet over een vorige versie heen worden geïnstalleerd."
          fi

      # Openbare SHA-256-vingerafdruk van het certificaat (voor bingr.online/.well-known/assetlinks.json, Android app links)
      - name: Vingerafdruk van het ondertekencertificaat
        if: env.BINGR_KEYSTORE != ''
        env:
          PW: ${{ secrets.BINGR_KEYSTORE_PASSWORD }}
        run: |
          fp=$(keytool -list -v -keystore "$BINGR_KEYSTORE" -storepass:env PW -alias bingr 2>/dev/null | grep -m1 -E '^\s*SHA256:' | sed -E 's/^\s*SHA256:\s*//' || true)
          [[ "$fp" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] && echo "::notice title=assetlinks.json::SHA256 $fp" || echo "::warning::Vingerafdruk van het certificaat niet gevonden"

      # Pushmeldingen (FCM): google-services.json uit het secret GOOGLE_SERVICES_JSON (nooit in de repo of in het log).
      # Ontbreekt het, dan bouwt de app zonder push en registreert hij niets.
      - name: Firebase-configuratie klaarzetten
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/google-services.json
            if python3 -c 'import json,sys; d=json.load(open("app/google-services.json")); sys.exit(0 if any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="nl.lrvdlinden.bingr" for c in d.get("client",[])) else 1)'; then
              echo "::notice::Pushmeldingen aan (google-services.json uit het secret)"
            else
              rm -f app/google-services.json
              echo "::warning::Secret GOOGLE_SERVICES_JSON is geen geldige google-services.json voor nl.lrvdlinden.bingr: APK zonder pushmeldingen."
            fi
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON ontbreekt: APK zonder pushmeldingen."
          fi

      - name: APK bouwen
        env:
          BINGR_KEYSTORE_PASSWORD: ${{ secrets.BINGR_KEYSTORE_PASSWORD }}
          BINGR_KEY_ALIAS: bingr
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Stack vertalen (R8 retrace, build 178)
        run: |
          set -uo pipefail
          MAP=app/build/outputs/mapping/release/mapping.txt
          [ -s "$MAP" ] || { echo "::error::geen mapping.txt"; exit 1; }
          cat > stack.txt <<'EOT'
          java.lang.NullPointerException
          	at p6.Io.k(SourceFile:3)
          	at F3.H.g(SourceFile:46)
          	at F3.H.e(SourceFile:178)
          	at a0.a.d(SourceFile:44)
          	at a0.a.e(SourceFile:9)
          	at A.o.k(SourceFile:62)
          	at a0.a.g(SourceFile:44)
          	at a0.a.k(SourceFile:9)
          	at A.q.f(SourceFile:64)
          	at a0.a.f(SourceFile:52)
          	at S.d.a(SourceFile:227)
          	at z3.f.a(SourceFile:248)
          	at z.i.e(SourceFile:106)
          	at B.C.f(SourceFile:361)
          	at a0.a.f(SourceFile:52)
          	at S.d.a(SourceFile:227)
          	at b0.h.a(SourceFile:149)
          	at B.d0.a(SourceFile:84)
          	at v0.c.G(SourceFile:106)
          	at B.z.f(SourceFile:1413)
          	at a0.a.f(SourceFile:52)
          	at B.z.f(SourceFile:1154)
          	at a0.a.f(SourceFile:52)
          	at S.d.J(SourceFile:15)
          	at S.q.o(SourceFile:197)
          	at S.u.i(SourceFile:34)
          	at S.u0.a(SourceFile:45)
          	at S.o.a(SourceFile:5)
          	at S.o.a(SourceFile:5)
          	at S.u.j(SourceFile:7)
          	at B0.E.i(SourceFile:35)
          	at B0.E.h(SourceFile:120)
          	at B0.E.f(SourceFile:116)
          	at B.j0.d(SourceFile:51)
          	at B.j0.b(SourceFile:91)
          	at B.b.run(SourceFile:65)
          EOT
          sed -i 's/^          //' stack.txt
          mkdir -p /tmp/rt
          rt=$(ls -d "${ANDROID_HOME:-/nonexistent}"/cmdline-tools/*/bin/retrace 2>/dev/null | sort -V | tail -1)
          if [ -n "$rt" ]; then "$rt" "$MAP" stack.txt > /tmp/rt/retrace.txt 2>/tmp/rt/retrace.err; else
            r8=$(find ~/.gradle -name 'r8-*.jar' 2>/dev/null | sort -V | tail -1)
            java -cp "$r8" com.android.tools.r8.retrace.Retrace "$MAP" stack.txt > /tmp/rt/retrace.txt 2>/tmp/rt/retrace.err
          fi
          # welke klassen zitten achter de korte namen (alleen klasse-regels, geen mapping zelf)
          { for c in p6.Io F3.H a0.a A.o A.q S.d z3.f z.i B.C b0.h B.d0 v0.c B.z B0.E B.j0 B.b; do grep -E " -> ${c//./\\.}:\$" "$MAP" || echo "GEEN $c"; done; } > /tmp/rt/classes.txt
          # de leden van de twee bovenste klassen (uit de mapping, alleen deze twee blokken)
          for c in p6.Io F3.H; do awk -v pat=" -> $c:" 'index($0,pat){p=1;print;next} p&&/^[^ ]/{p=0} p' "$MAP" > "/tmp/rt/members-$c.txt"; done
          cat /tmp/rt/retrace.txt
          cat /tmp/rt/classes.txt
          msg=$(head -c 3500 /tmp/rt/retrace.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Retrace::$msg"
          msg=$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/rt/classes.txt)
          echo "::notice title=Klassen::$msg"
          echo "$(git rev-parse --short HEAD)" > /tmp/rt/status.txt
          cd /tmp/rt && git init -q -b ci-logs-retrace && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Retrace $(cat status.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-retrace

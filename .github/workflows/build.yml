name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ondertekensleutel klaarzetten
        env:
          KS: ${{ secrets.BINGR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bingr-release.jks"
            echo "BINGR_KEYSTORE=$RUNNER_TEMP/bingr-release.jks" >> "$GITHUB_ENV"
            echo "::notice::APK wordt ondertekend met de vaste Bingr-sleutel"
          else
            echo "::warning::Secret BINGR_KEYSTORE_BASE64 ontbreekt: APK krijgt een tijdelijke sleutel en kan niet over een vorige versie heen worden geïnstalleerd."
          fi

      # Openbare SHA-256-vingerafdruk van het certificaat (voor bingr.online/.well-known/assetlinks.json, Android app links)
      - name: Vingerafdruk van het ondertekencertificaat
        if: env.BINGR_KEYSTORE != ''
        env:
          PW: ${{ secrets.BINGR_KEYSTORE_PASSWORD }}
        run: |
          fp=$(keytool -list -v -keystore "$BINGR_KEYSTORE" -storepass:env PW -alias bingr 2>/dev/null | grep -m1 -E '^\s*SHA256:' | sed -E 's/^\s*SHA256:\s*//' || true)
          [[ "$fp" =~ ^([0-9A-F]{2}:){31}[0-9A-F]{2}$ ]] && echo "::notice title=assetlinks.json::SHA256 $fp" || echo "::warning::Vingerafdruk van het certificaat niet gevonden"

      # Pushmeldingen (FCM): google-services.json uit het secret GOOGLE_SERVICES_JSON (nooit in de repo of in het log).
      # Ontbreekt het, dan bouwt de app zonder push en registreert hij niets.
      - name: Firebase-configuratie klaarzetten
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/google-services.json
            if python3 -c 'import json,sys; d=json.load(open("app/google-services.json")); sys.exit(0 if any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="nl.lrvdlinden.bingr" for c in d.get("client",[])) else 1)'; then
              echo "::notice::Pushmeldingen aan (google-services.json uit het secret)"
            else
              rm -f app/google-services.json
              echo "::warning::Secret GOOGLE_SERVICES_JSON is geen geldige google-services.json voor nl.lrvdlinden.bingr: APK zonder pushmeldingen."
            fi
          else
            echo "::warning::Secret GOOGLE_SERVICES_JSON ontbreekt: APK zonder pushmeldingen."
          fi

      - name: APK bouwen
        env:
          BINGR_KEYSTORE_PASSWORD: ${{ secrets.BINGR_KEYSTORE_PASSWORD }}
          BINGR_KEY_ALIAS: bingr
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # build 120: SHA-256-vingerafdruk van het ondertekencertificaat voor assetlinks.json op bingr.online (app links
      # https://bingr.online/titel/…). De vingerafdruk is openbaar (staat in elke APK); de keystore en wachtwoorden
      # worden hier niet gebruikt en nooit gelogd.
      - name: Vingerafdruk ondertekencertificaat
        if: success()
        run: |
          set +e
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || { echo "::warning::Geen APK gevonden voor de vingerafdruk."; exit 0; }
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner
          FP=""
          if [ -x "$SIGNER" ]; then
            FP=$("$SIGNER" verify --print-certs "$APK" 2>/dev/null | grep -m1 'certificate SHA-256 digest:' | awk '{print $NF}')
          fi
          if [ -z "$FP" ]; then
            FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':')
          fi
          [ -n "$FP" ] || { echo "::warning::Vingerafdruk van het ondertekencertificaat niet te bepalen."; exit 0; }
          FP=$(printf '%s' "$FP" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ -n "${BINGR_KEYSTORE:-}" ]; then
            echo "::notice title=assetlinks.json::SHA-256 ondertekencertificaat (vaste Bingr-sleutel): $FP"
          else
            echo "::warning::APK met een tijdelijke sleutel getekend (BINGR_KEYSTORE_BASE64 ontbreekt); deze vingerafdruk hoort NIET in assetlinks.json: $FP"
          fi

      - name: Foutmeldingen samenvatten
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|> " -A3 build.log | head -300 > errors.txt || true
          cat errors.txt
          grep -E "^e: " build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true
          echo '```' >> $GITHUB_STEP_SUMMARY; head -150 errors.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      # Pakketten staan nooit (onversleuteld) op GitHub: geen artefact, geen release, niet in een openbare repo. Ze gaan
      # versleuteld naar de PRIVÉ repo LRvdLinden/bingr-inbox (tools/seal_build.sh van bingr-beheer, branch inbox-<platform>);
      # de workflow Builds van bingr-beheer haalt ze daar op en zet ze in de afgesloten map builds/ op de server van
      # beheer.bingr.online. Nodig: secret BINGR_INBOX_TOKEN (fine-grained, alleen Contents: Read and write op bingr-inbox).
      # H3: géén token voor bingr-beheer meer; die openbare repo wordt anoniem gekloond, het token gaat nooit in een URL.
      - name: APK versleuteld aanleveren voor beheer.bingr.online
        if: success() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.BINGR_INBOX_TOKEN }}
          BINGR_INBOX_REPO: LRvdLinden/bingr-inbox
        run: |
          set -euo pipefail
          # build 97: nooit een APK met de tijdelijke debug-sleutel aanleveren (die installeert niet over de echte heen)
          if [ -z "${BINGR_KEYSTORE:-}" ]; then
            echo "::error::Secret BINGR_KEYSTORE_BASE64 ontbreekt: APK is met de debug-sleutel getekend en wordt niet aangeleverd."
            exit 1
          fi
          V=$(grep '^BINGR_VERSION=' gradle.properties | cut -d= -f2); B=$(grep '^BINGR_BUILD=' gradle.properties | cut -d= -f2)
          mkdir -p "$RUNNER_TEMP/pkg"; cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/pkg/Bingr-$V-build$B.apk"
          # notities uit CHANGELOG.md (sectie van dit buildnummer)
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' CHANGELOG.md > "$RUNNER_TEMP/pkg/notes.md"
          [ -s "$RUNNER_TEMP/pkg/notes.md" ] || echo "Bingr $V, build $B." > "$RUNNER_TEMP/pkg/notes.md"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          # bewust geen terugval op een ander token: zonder BINGR_INBOX_TOKEN wordt er niets aangeleverd
          [ -n "$TOKEN" ] || { echo "::warning::Secret BINGR_INBOX_TOKEN ontbreekt: APK niet aangeleverd (zie README.md van bingr-beheer, H3)."; exit 0; }
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 https://github.com/LRvdLinden/bingr-beheer.git "$RUNNER_TEMP/beheer" 2>/dev/null \
            || { echo "::error::bingr-beheer niet op te halen."; exit 1; }
          TOKEN="$TOKEN" "$RUNNER_TEMP/beheer/tools/seal_build.sh" android "$RUNNER_TEMP/pkg/Bingr-$V-build$B.apk" "$V" "$B" "$RUNNER_TEMP/pkg/notes.md"
          rm -rf "$RUNNER_TEMP/pkg"

      # build 97: niet bij pull requests (die mogen de branch ci-logs niet overschrijven)
      - name: Log op branch ci-logs zetten
        if: always() && github.event_name != 'pull_request'
        run: |
          set +e
          mkdir -p /tmp/logs; cp build.log /tmp/logs/ 2>/dev/null; cp errors.txt /tmp/logs/ 2>/dev/null
          echo "${{ job.status }} $(git rev-parse --short HEAD)" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q -b ci-logs && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "CI-log $(cat status.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  # Samsung Tizen TV: .wgt uit tizen/ (zelfde versie en buildnummer als de APK)
  tizen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # oude Samsung-tv's (Tizen 4.0 = Chromium M56): geen nieuwere JS-syntax, API's of CSS in de app
      # build 97: pipefail (een fout van check_compat ging verloren in `| tee`) en een mislukte npm-installatie laat de job falen;
      # terser komt mee voor de bundel van package.sh (NODE_PATH via GITHUB_ENV)
      - name: Compatibiliteit met oude tv's controleren
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/tlogs" "$RUNNER_TEMP/compat"
          if ! (cd "$RUNNER_TEMP/compat" && npm init -y >/dev/null && npm i --no-save --no-audit --no-fund acorn@8.14.0 acorn-walk@8.3.4 terser@5.36.0 > "$RUNNER_TEMP/tlogs/npm.log" 2>&1); then
            tail -30 "$RUNNER_TEMP/tlogs/npm.log" || true
            echo "::error::acorn/terser niet te installeren; de compatibiliteitscontrole kan niet draaien" | tee "$RUNNER_TEMP/tlogs/compat.log"
            exit 1
          fi
          echo "NODE_PATH=$RUNNER_TEMP/compat/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/compat/node_modules" node tizen/tools/check_compat.js 2>&1 | tee "$RUNNER_TEMP/tlogs/compat.log"

      - name: Tizen Studio CLI uit de cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/tizen-studio
          key: tizen-studio-web-cli-v1

      - name: Tizen Studio CLI installeren
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tlogs"
          exec > >(tee -a "$RUNNER_TEMP/tlogs/download.log") 2>&1
          for v in 6.1 6.0 5.6 5.5; do
            url="https://download.tizen.org/sdk/Installer/tizen-studio_$v/web-cli_Tizen_Studio_${v}_ubuntu-64.bin"
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/web-cli.bin" "$url"; then echo "Tizen Studio $v gedownload"; break; fi
            rm -f "$RUNNER_TEMP/web-cli.bin"
          done
          test -s "$RUNNER_TEMP/web-cli.bin"
          chmod +x "$RUNNER_TEMP/web-cli.bin"
          mkdir -p "$RUNNER_TEMP/tlogs"
          # half geïnstalleerd niet laten staan: anders bewaart de cache een kapotte map en wordt er nooit opnieuw geïnstalleerd
          "$RUNNER_TEMP/web-cli.bin" --accept-license "$HOME/tizen-studio" > "$RUNNER_TEMP/tlogs/install.log" 2>&1 || { tail -40 "$RUNNER_TEMP/tlogs/install.log"; rm -rf "$HOME/tizen-studio"; exit 1; }
          test -x "$HOME/tizen-studio/tools/ide/bin/tizen" || { echo "tizen-CLI ontbreekt na installatie"; rm -rf "$HOME/tizen-studio"; exit 1; }
          tail -5 "$RUNNER_TEMP/tlogs/install.log"

      - name: Ondertekenprofiel klaarzetten
        id: sign
        continue-on-error: true
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DIST_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DIST_PW: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tlogs"
          exec > >(tee -a "$RUNNER_TEMP/tlogs/sign.log") 2>&1
          ls "$HOME/tizen-studio" "$HOME/tizen-studio/tools/ide/bin" 2>&1 | head -40 || true
          T="$HOME/tizen-studio/tools/ide/bin/tizen"
          test -x "$T"
          "$T" version || true
          KS="$RUNNER_TEMP/keys"; mkdir -p "$KS"
          # pad voor de security-profielen instellen (bestaat nog niet op een schone runner)
          mkdir -p "$HOME/tizen-studio-data/profile"
          [ -f "$HOME/tizen-studio-data/profile/profiles.xml" ] || printf '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n<profiles active="" version="3.1"/>\n' > "$HOME/tizen-studio-data/profile/profiles.xml"
          "$T" cli-config "default.profiles.path=$HOME/tizen-studio-data/profile/profiles.xml" || true
          "$T" cli-config -l || true
          if [ -n "$AUTHOR_P12" ] && [ -n "$DIST_P12" ]; then
            echo "$AUTHOR_P12" | base64 -d > "$KS/author.p12"
            echo "$DIST_P12" | base64 -d > "$KS/distributor.p12"
            "$T" security-profiles add -n bingr -a "$KS/author.p12" -p "$AUTHOR_PW" -d "$KS/distributor.p12" -dp "$DIST_PW"
            APW="$AUTHOR_PW"; DPW="$DIST_PW"; KIND=samsung
            echo "::notice::Tizen-app wordt ondertekend met het Samsung-certificaat uit de secrets"
          else
            # geen Samsung-certificaat: tijdelijk eigen auteurscertificaat met de standaard Tizen-distributeur
            APW="ci-$(openssl rand -hex 12)"; DPW="tizenpkcs12passfordsigner"; KIND=tizen
            "$T" certificate -a BingrCI -p "$APW" -c NL -ct Bingr -o Bingr -n "Bingr CI" -f bingr-ci
            AUTHOR=$(find "$HOME/tizen-studio-data" -name 'bingr-ci.p12' | head -1)
            "$T" security-profiles add -n bingr -a "$AUTHOR" -p "$APW"
            echo "::warning::Secrets TIZEN_AUTHOR_P12_BASE64 / TIZEN_DISTRIBUTOR_P12_BASE64 ontbreken: de .wgt krijgt een tijdelijk test-certificaat en installeert niet op een Samsung-tv. Zie tizen/README.md."
          fi
          # zonder sleutelbos (headless runner) wachtwoorden direct in profiles.xml zetten
          PROFILES=$(find "$HOME/tizen-studio-data" -name profiles.xml | head -1)
          python3 - "$PROFILES" "$APW" "$DPW" <<'PY'
          import re, sys
          p, apw, dpw = sys.argv[1:4]
          s = open(p, encoding='utf-8').read()
          def fix(m):
              item = m.group(0)
              if 'key=""' in item:
                  return item
              pw = apw if 'distributor="0"' in item else dpw
              return re.sub(r'password="[^"]*"', 'password="%s"' % pw, item)
          s = re.sub(r'<profileitem\b[^>]*/>', fix, s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -E 's/password="[^"]*"/password="***"/g' "$PROFILES" || true
          "$T" security-profiles list || true
          echo "TIZEN_CLI=$T" >> "$GITHUB_ENV"
          echo "TIZEN_PROFILE=bingr" >> "$GITHUB_ENV"
          echo "SIGN_KIND=$KIND" >> "$GITHUB_ENV"

      - name: .wgt bouwen
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/tlogs"
          tizen/tools/package.sh "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/tlogs/package.log"
          # build 97: ook de bundel in het pakket (js/bingr.min.js, js/boot.js, js/strings/) moet op Chromium M56 draaien
          node tizen/tools/check_compat.js "$RUNNER_TEMP/out/app" 2>&1 | tee -a "$RUNNER_TEMP/tlogs/compat.log"
          V=$(grep '^BINGR_VERSION=' gradle.properties | cut -d= -f2); B=$(grep '^BINGR_BUILD=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          if [ -f "$RUNNER_TEMP/out/Bingr-$V-build$B.wgt" ]; then
            if [ "${SIGN_KIND:-}" = "samsung" ]; then
              cp "$RUNNER_TEMP/out/Bingr-$V-build$B.wgt" dist/
            else
              cp "$RUNNER_TEMP/out/Bingr-$V-build$B.wgt" "dist/Bingr-$V-build$B-testsigned.wgt"
            fi
          else
            cp "$RUNNER_TEMP/out/"*.wgt dist/
          fi
          ls -la dist
          echo "SIGN_KIND=${SIGN_KIND:-unsigned}" > dist/signing.txt

      # zoals de APK: naar de privé repo bingr-inbox met BINGR_INBOX_TOKEN (H3)
      - name: Samsung TV-pakket versleuteld aanleveren voor beheer.bingr.online
        if: success() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.BINGR_INBOX_TOKEN }}
          BINGR_INBOX_REPO: LRvdLinden/bingr-inbox
        run: |
          set -euo pipefail
          V=$(grep '^BINGR_VERSION=' gradle.properties | cut -d= -f2); B=$(grep '^BINGR_BUILD=' gradle.properties | cut -d= -f2)
          KIND=$(grep -o 'SIGN_KIND=.*' dist/signing.txt | cut -d= -f2 || true)
          [ "$KIND" = "samsung" ] || echo "::notice::Samsung TV: .wgt ondertekend als '$KIND' (geen Samsung-certificaat)."
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Bingr $V, build $B." > "$RUNNER_TEMP/notes.md"
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          [ -n "$TOKEN" ] || { echo "::warning::Secret BINGR_INBOX_TOKEN ontbreekt: .wgt niet aangeleverd (zie README.md van bingr-beheer, H3)."; exit 0; }
          rm -rf "$RUNNER_TEMP/beheer"
          GIT_TERMINAL_PROMPT=0 git clone -q --depth 1 https://github.com/LRvdLinden/bingr-beheer.git "$RUNNER_TEMP/beheer" 2>/dev/null \
            || { echo "::error::bingr-beheer niet op te halen."; exit 1; }
          w=$(ls dist/*.wgt | head -1)
          TOKEN="$TOKEN" "$RUNNER_TEMP/beheer/tools/seal_build.sh" tizen "$w" "$V" "$B" "$RUNNER_TEMP/notes.md"

      # build 97: niet bij pull requests
      - name: Tizen-log op branch ci-logs-tizen zetten
        if: always() && github.event_name != 'pull_request'
        run: |
          set +e
          mkdir -p /tmp/tlogs; cp "$RUNNER_TEMP"/tlogs/*.log /tmp/tlogs/ 2>/dev/null; cp dist/signing.txt /tmp/tlogs/ 2>/dev/null
          echo "${{ job.status }} $(git rev-parse --short HEAD)" > /tmp/tlogs/status.txt
          cd /tmp/tlogs && git init -q -b ci-logs-tizen && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Tizen-log $(cat status.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-tizen

name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ondertekensleutel klaarzetten
        env:
          KS: ${{ secrets.BINGR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bingr-release.jks"
            echo "BINGR_KEYSTORE=$RUNNER_TEMP/bingr-release.jks" >> "$GITHUB_ENV"
            echo "::notice::APK wordt ondertekend met de vaste Bingr-sleutel"
          else
            echo "::warning::Secret BINGR_KEYSTORE_BASE64 ontbreekt: APK krijgt een tijdelijke sleutel en kan niet over een vorige versie heen worden geïnstalleerd."
          fi

      - name: APK bouwen
        env:
          BINGR_KEYSTORE_PASSWORD: ${{ secrets.BINGR_KEYSTORE_PASSWORD }}
          BINGR_KEY_ALIAS: bingr
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Foutmeldingen samenvatten
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Could not resolve|> " -A3 build.log | head -300 > errors.txt || true
          cat errors.txt
          grep -E "^e: " build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true
          echo '```' >> $GITHUB_STEP_SUMMARY; head -150 errors.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Bingr-Android-apk
          path: app/build/outputs/apk/release/*.apk

      - name: APK als GitHub-release publiceren
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^BINGR_VERSION=' gradle.properties | cut -d= -f2); B=$(grep '^BINGR_BUILD=' gradle.properties | cut -d= -f2)
          TAG="v$V-build$B"; APK="Bingr-$V-build$B.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          # release-notities uit CHANGELOG.md (sectie van dit buildnummer)
          awk -v b="Build $B" '/^## /{f=($0 ~ (b "$"))?1:0; next} f && !/^_.*_$/' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Bingr voor Android $V, build $B." > notes.md
          printf '\nInstalleer de APK over de vorige versie heen; je gegevens blijven bewaard. Alle versies: https://bingr.online/changelog/?p=android\n' >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --notes-file notes.md; else gh release create "$TAG" --title "Bingr $V (build $B)" --notes-file notes.md --latest; fi
          gh release upload "$TAG" "$APK" --clobber

      - name: Log op branch ci-logs zetten
        if: always()
        run: |
          set +e
          mkdir -p /tmp/logs; cp build.log /tmp/logs/ 2>/dev/null; cp errors.txt /tmp/logs/ 2>/dev/null
          echo "${{ job.status }} $(git rev-parse --short HEAD)" > /tmp/logs/status.txt
          cd /tmp/logs && git init -q -b ci-logs && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "CI-log $(cat status.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  # Samsung Tizen TV: .wgt uit tizen/ (zelfde versie en buildnummer als de APK)
  tizen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Tizen Studio CLI uit de cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/tizen-studio
          key: tizen-studio-web-cli-v1

      - name: Tizen Studio CLI installeren
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tlogs"
          exec > >(tee -a "$RUNNER_TEMP/tlogs/download.log") 2>&1
          for v in 6.1 6.0 5.6 5.5; do
            url="https://download.tizen.org/sdk/Installer/tizen-studio_$v/web-cli_Tizen_Studio_${v}_ubuntu-64.bin"
            if curl -fsSL --retry 2 -o "$RUNNER_TEMP/web-cli.bin" "$url"; then echo "Tizen Studio $v gedownload"; break; fi
            rm -f "$RUNNER_TEMP/web-cli.bin"
          done
          test -s "$RUNNER_TEMP/web-cli.bin"
          chmod +x "$RUNNER_TEMP/web-cli.bin"
          mkdir -p "$RUNNER_TEMP/tlogs"
          "$RUNNER_TEMP/web-cli.bin" --accept-license "$HOME/tizen-studio" > "$RUNNER_TEMP/tlogs/install.log" 2>&1 || { tail -40 "$RUNNER_TEMP/tlogs/install.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/tlogs/install.log"

      - name: Ondertekenprofiel klaarzetten
        id: sign
        continue-on-error: true
        env:
          AUTHOR_P12: ${{ secrets.TIZEN_AUTHOR_P12_BASE64 }}
          AUTHOR_PW: ${{ secrets.TIZEN_AUTHOR_PASSWORD }}
          DIST_P12: ${{ secrets.TIZEN_DISTRIBUTOR_P12_BASE64 }}
          DIST_PW: ${{ secrets.TIZEN_DISTRIBUTOR_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tlogs"
          exec > >(tee -a "$RUNNER_TEMP/tlogs/sign.log") 2>&1
          ls "$HOME/tizen-studio" "$HOME/tizen-studio/tools/ide/bin" 2>&1 | head -40 || true
          T="$HOME/tizen-studio/tools/ide/bin/tizen"
          test -x "$T"
          "$T" version || true
          KS="$RUNNER_TEMP/keys"; mkdir -p "$KS"
          # pad voor de security-profielen instellen (bestaat nog niet op een schone runner)
          mkdir -p "$HOME/tizen-studio-data/profile"
          [ -f "$HOME/tizen-studio-data/profile/profiles.xml" ] || printf '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n<profiles active="" version="3.1"/>\n' > "$HOME/tizen-studio-data/profile/profiles.xml"
          "$T" cli-config "default.profiles.path=$HOME/tizen-studio-data/profile/profiles.xml" || true
          "$T" cli-config -l || true
          if [ -n "$AUTHOR_P12" ] && [ -n "$DIST_P12" ]; then
            echo "$AUTHOR_P12" | base64 -d > "$KS/author.p12"
            echo "$DIST_P12" | base64 -d > "$KS/distributor.p12"
            "$T" security-profiles add -n bingr -a "$KS/author.p12" -p "$AUTHOR_PW" -d "$KS/distributor.p12" -dp "$DIST_PW"
            APW="$AUTHOR_PW"; DPW="$DIST_PW"; KIND=samsung
            echo "::notice::Tizen-app wordt ondertekend met het Samsung-certificaat uit de secrets"
          else
            # geen Samsung-certificaat: tijdelijk eigen auteurscertificaat met de standaard Tizen-distributeur
            APW="ci-$(openssl rand -hex 12)"; DPW="tizenpkcs12passfordsigner"; KIND=tizen
            "$T" certificate -a BingrCI -p "$APW" -c NL -ct Bingr -o Bingr -n "Bingr CI" -f bingr-ci
            AUTHOR=$(find "$HOME/tizen-studio-data" -name 'bingr-ci.p12' | head -1)
            "$T" security-profiles add -n bingr -a "$AUTHOR" -p "$APW"
            echo "::warning::Secrets TIZEN_AUTHOR_P12_BASE64 / TIZEN_DISTRIBUTOR_P12_BASE64 ontbreken: de .wgt krijgt een tijdelijk test-certificaat en installeert niet op een Samsung-tv. Zie tizen/README.md."
          fi
          # zonder sleutelbos (headless runner) wachtwoorden direct in profiles.xml zetten
          PROFILES=$(find "$HOME/tizen-studio-data" -name profiles.xml | head -1)
          python3 - "$PROFILES" "$APW" "$DPW" <<'PY'
          import re, sys
          p, apw, dpw = sys.argv[1:4]
          s = open(p, encoding='utf-8').read()
          def fix(m):
              item = m.group(0)
              if 'key=""' in item:
                  return item
              pw = apw if 'distributor="0"' in item else dpw
              return re.sub(r'password="[^"]*"', 'password="%s"' % pw, item)
          s = re.sub(r'<profileitem\b[^>]*/>', fix, s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -E 's/password="[^"]*"/password="***"/g' "$PROFILES" || true
          "$T" security-profiles list || true
          echo "TIZEN_CLI=$T" >> "$GITHUB_ENV"
          echo "TIZEN_PROFILE=bingr" >> "$GITHUB_ENV"
          echo "SIGN_KIND=$KIND" >> "$GITHUB_ENV"

      - name: .wgt bouwen
        run: |
          mkdir -p "$RUNNER_TEMP/tlogs"
          tizen/tools/package.sh "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/tlogs/package.log"
          V=$(grep '^BINGR_VERSION=' gradle.properties | cut -d= -f2); B=$(grep '^BINGR_BUILD=' gradle.properties | cut -d= -f2)
          mkdir -p dist
          if [ -f "$RUNNER_TEMP/out/Bingr-$V-build$B.wgt" ]; then
            if [ "${SIGN_KIND:-}" = "samsung" ]; then
              cp "$RUNNER_TEMP/out/Bingr-$V-build$B.wgt" dist/
            else
              cp "$RUNNER_TEMP/out/Bingr-$V-build$B.wgt" "dist/Bingr-$V-build$B-testsigned.wgt"
            fi
          else
            cp "$RUNNER_TEMP/out/"*.wgt dist/
          fi
          ls -la dist
          echo "SIGN_KIND=${SIGN_KIND:-unsigned}" > dist/signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-Tizen-wgt
          path: dist/

      - name: Tizen-log op branch ci-logs-tizen zetten
        if: always()
        run: |
          set +e
          mkdir -p /tmp/tlogs; cp "$RUNNER_TEMP"/tlogs/*.log /tmp/tlogs/ 2>/dev/null; cp dist/signing.txt /tmp/tlogs/ 2>/dev/null
          echo "${{ job.status }} $(git rev-parse --short HEAD)" > /tmp/tlogs/status.txt
          cd /tmp/tlogs && git init -q -b ci-logs-tizen && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Tizen-log $(cat status.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-tizen

  tizen-release:
    needs: [apk, tizen]
    if: ${{ always() && needs.tizen.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Bingr-Tizen-wgt
          path: dist

      - name: .wgt bij de GitHub-release zetten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^BINGR_VERSION=' gradle.properties | cut -d= -f2); B=$(grep '^BINGR_BUILD=' gradle.properties | cut -d= -f2)
          TAG="v$V-build$B"
          KIND=$(grep -o 'SIGN_KIND=.*' dist/signing.txt | cut -d= -f2)
          # de APK-job maakt de release; bestaat hij nog niet (APK mislukt), dan hier maken
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Bingr $V (build $B)" --notes "Bingr $V, build $B." --latest || gh release view "$TAG" >/dev/null
          fi
          case "$KIND" in
            samsung) NOTE="Samsung TV (Tizen): installeer de .wgt met Tizen Studio of de tizen-CLI over de vorige versie heen; je gegevens blijven bewaard. Uitleg: https://github.com/${{ github.repository }}/blob/main/tizen/README.md" ;;
            tizen) NOTE="Samsung TV (Tizen): deze .wgt is met een tijdelijk test-certificaat ondertekend (de Samsung-certificaat-secrets ontbreken) en installeert niet op een Samsung-tv. Uitleg: https://github.com/${{ github.repository }}/blob/main/tizen/README.md" ;;
            *) NOTE="Samsung TV (Tizen): deze .wgt is niet ondertekend (de Tizen-CLI was niet beschikbaar). Uitleg: https://github.com/${{ github.repository }}/blob/main/tizen/README.md" ;;
          esac
          gh release view "$TAG" --json body -q .body > body.md || true
          if ! grep -q "Samsung TV (Tizen)" body.md; then
            printf '\n%s\n' "$NOTE" >> body.md
          else
            python3 - "$NOTE" <<'PY'
          import sys
          note = sys.argv[1]
          lines = open('body.md', encoding='utf-8').read().split('\n')
          lines = [note if l.startswith('Samsung TV (Tizen)') else l for l in lines]
          open('body.md', 'w', encoding='utf-8').write('\n'.join(lines))
          PY
          fi
          gh release edit "$TAG" --notes-file body.md
          # oude .wgt-varianten van deze build weghalen, dan de nieuwe uploaden
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep '\.wgt$' || true); do
            [ -f "dist/$a" ] || gh release delete-asset "$TAG" "$a" -y || true
          done
          gh release upload "$TAG" dist/*.wgt --clobber

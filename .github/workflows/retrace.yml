name: Retrace

# Build 179 (X1): een R8-verkorte stacktrace (crashrapport uit het beheer of een melding van een gebruiker) terugvertalen
# naar de echte klassen en regels. De R8-mapping komt nooit op GitHub (geen artefact, niet in de repo, niet in een log):
# deze workflow bouwt de release van de gevraagde commit opnieuw (R8 is deterministisch bij dezelfde invoer, net als
# de workflow Build), vertaalt de stack en zet alleen de vertaalde stack als annotatie en op de branch ci-logs-retrace.
# Adressen (http…, IP-nummers) en e-mailadressen worden eruit gehaald.
#
# Starten (gh workflow run werkt hier niet):
#   gh api -X POST repos/LRvdLinden/bingr-android/actions/workflows/retrace.yml/dispatches -f ref=main \
#     -f "inputs[commit]=<sha of tag van de build>" -f "inputs[stack]=$(cat stack.txt)"
# Uitkomst: git fetch origin ci-logs-retrace && git show FETCH_HEAD:retrace.txt

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit (sha) of tag van de build waarvan de stack komt'
        required: true
      stack:
        description: 'De verkorte stacktrace (zoals in het crashrapport)'
        required: true

permissions:
  contents: write

concurrency:
  group: retrace
  cancel-in-progress: false

jobs:
  retrace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Commit controleren
        env:
          C: ${{ inputs.commit }}
        run: |
          [[ "$C" =~ ^[A-Za-z0-9._/-]{1,80}$ ]] || { echo "::error::ongeldige commit/tag"; exit 1; }
          echo "RETRACE_COMMIT=$C" >> "$GITHUB_ENV"

      # hele geschiedenis, zodat ook een korte sha of een tag werkt
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (v5.1.0)
        with:
          fetch-depth: 0

      - name: Commit van de build klaarzetten
        run: git checkout -q --detach "$RETRACE_COMMIT^{commit}" || { echo "::error::commit/tag niet gevonden"; exit 1; }

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.10.2'

      # zelfde invoer als de workflow Build (sleutel en Firebase-configuratie), zodat R8 dezelfde namen kiest;
      # niets hiervan wordt gelogd
      - name: Ondertekensleutel klaarzetten
        env:
          KS: ${{ secrets.BINGR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/bingr-release.jks"
            echo "BINGR_KEYSTORE=$RUNNER_TEMP/bingr-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Firebase-configuratie klaarzetten
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            printf '%s' "$GSJ" > app/google-services.json
            python3 -c 'import json,sys; d=json.load(open("app/google-services.json")); sys.exit(0 if any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="nl.lrvdlinden.bingr" for c in d.get("client",[])) else 1)' \
              || rm -f app/google-services.json
          fi

      - name: Release bouwen (alleen voor de mapping; de APK gaat nergens heen)
        env:
          BINGR_KEYSTORE_PASSWORD: ${{ secrets.BINGR_KEYSTORE_PASSWORD }}
          BINGR_KEY_ALIAS: bingr
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle --no-daemon -q assembleRelease > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "^e: |What went wrong" -A2 "$RUNNER_TEMP/build.log" | head -20 | while IFS= read -r l; do echo "::error::${l:0:300}"; done; exit 1; }
          rm -f app/build/outputs/apk/release/*.apk

      - name: Stack vertalen
        env:
          STACK: ${{ inputs.stack }}
        run: |
          set -uo pipefail
          MAP=app/build/outputs/mapping/release/mapping.txt
          [ -s "$MAP" ] || { echo "::error::geen mapping.txt na het bouwen"; exit 1; }
          clean() { sed -E -e 's#[a-zA-Z][a-zA-Z0-9+.-]*://[^ )]*#<adres>#g' \
                           -e 's#\b[0-9]{1,3}(\.[0-9]{1,3}){3}\b#<ip>#g' \
                           -e 's#[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}#<e-mail>#g'; }
          mkdir -p /tmp/rt
          printf '%s\n' "$STACK" | tr -d '\r' | clean > "$RUNNER_TEMP/stack.txt"
          rt=$(ls -d "${ANDROID_HOME:-/nonexistent}"/cmdline-tools/*/bin/retrace 2>/dev/null | sort -V | tail -1)
          if [ -n "$rt" ]; then "$rt" "$MAP" "$RUNNER_TEMP/stack.txt" > "$RUNNER_TEMP/out.txt" 2>/dev/null
          else
            r8=$(find ~/.gradle -name 'r8-*.jar' 2>/dev/null | sort -V | tail -1)
            java -cp "$r8" com.android.tools.r8.retrace.Retrace "$MAP" "$RUNNER_TEMP/stack.txt" > "$RUNNER_TEMP/out.txt" 2>/dev/null
          fi
          [ -s "$RUNNER_TEMP/out.txt" ] || { echo "::error::retrace gaf geen uitvoer"; exit 1; }
          clean < "$RUNNER_TEMP/out.txt" > /tmp/rt/retrace.txt
          echo "$(git rev-parse --short HEAD)" > /tmp/rt/commit.txt
          cat /tmp/rt/retrace.txt
          # GitHub-annotaties: hooguit ~4 KB, regeleinden als %0A
          msg=$(head -c 3500 /tmp/rt/retrace.txt | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Retrace $(cat /tmp/rt/commit.txt)::$msg"

      - name: Uitkomst op branch ci-logs-retrace zetten
        run: |
          cd /tmp/rt && git init -q -b ci-logs-retrace && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Retrace $(cat commit.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-retrace
